name: dzen-wordpress
services:
  db:
    image: mariadb:11.7
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-wordpress-test
      MARIADB_ROOT_PASSWORD: local-wordpress-root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    ports:
      - "127.0.0.1:${DZEN_WORDPRESS_PORT:-8868}:80"
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-wordpress-test
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
    volumes: &wp_volumes
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/dzen-chat:ro
      - ./tests/api-fixture.php:/var/www/html/wp-content/mu-plugins/dzen-chat-test-api.php:ro
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment: *wp_environment
    volumes: *wp_volumes
    profiles: [tools]
    entrypoint: [wp]
    depends_on:
      db:
        condition: service_healthy
  cron:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment: *wp_environment
    volumes: *wp_volumes
    profiles: [cron]
    entrypoint: [/bin/sh, -c]
    command: ["while true; do wp cron event run dzen_chat_worker --due-now; sleep 15; done"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
volumes:
  db:
  wordpress:

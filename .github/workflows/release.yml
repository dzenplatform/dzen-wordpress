name: Plugin release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check package and version
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          make package-test
          if [ "$REF_TYPE" = tag ]; then
            ./bin/package.sh --tag "$REF_NAME"
          else
            make package
          fi
          unzip -t dist/dzen-chat-*.zip
          echo "version=$(python3 bin/package.py --version)" >> "$GITHUB_OUTPUT"
      - name: Start isolated WordPress
        run: |
          docker compose up -d --wait db wordpress
          for attempt in $(seq 1 30); do
            if docker compose exec -T wordpress test -f /var/www/html/wp-config.php; then
              break
            fi
            sleep 1
          done
          docker compose exec -T wordpress test -f /var/www/html/wp-config.php
          docker compose run --rm cli core install \
            --url=http://127.0.0.1:8868 --title='Dzen Chat contract tests' \
            --admin_user=dzen_test --admin_password=local-dzen-test-8868 \
            --admin_email=wordpress-fixture@example.org --skip-email
          docker compose run --rm cli plugin activate dzen-chat
      - name: Run PHP contract checks
        run: make test
      - name: Preserve build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dzen-chat-${{ steps.package.outputs.version }}
          path: |
            dist/dzen-chat-*.zip
            dist/dzen-chat-*.zip.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=60
      - name: Stop isolated WordPress
        if: always()
        run: docker compose down -v

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzen-chat-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish checked ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum --check "dzen-chat-$VERSION.zip.sha256"
          gh release create "$RELEASE_TAG" \
            "dzen-chat-$VERSION.zip" "dzen-chat-$VERSION.zip.sha256" \
            --verify-tag --title "Dzen Chat $VERSION" --notes-file release-notes.md
